# Test preview on GitHub Pages: https://radekpodrazil-maker.github.io/advenue-web/
# Always built with noindex. Install as .github/workflows/preview.yml and set
# Settings → Pages → Source: "GitHub Actions".
name: Preview on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (preview, noindex, under /advenue-web)
        run: python3 build.py
        env:
          SITE_ENV: preview
          BASE_PATH: /advenue-web
      - name: Check
        run: python3 check.py dist preview /advenue-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
